<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move a Dot — Firmware Installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 24px;
      color: #1a1a1a;
      background: #f9f9f9;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .subtitle { color: #666; margin-top: 0; margin-bottom: 32px; font-size: 0.95rem; }
    .device {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .device h2 { margin: 0 0 4px; font-size: 1rem; }
    .device p { margin: 0 0 16px; font-size: 0.85rem; color: #777; }
    esp-web-install-button { display: block; }
    .note {
      font-size: 0.8rem;
      color: #999;
      margin-top: 32px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Move a Dot</h1>
  <p class="subtitle">Connect your device via USB, then click Install.</p>

  <div class="device">
    <h2>Remote</h2>
    <p>M5Stack CoreS3 &mdash; ESP32-S3</p>
    <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
  </div>

  <div class="device">
    <h2>Circle Light</h2>
    <p>Wemos D1 Mini &mdash; ESP8266</p>
    <esp-web-install-button manifest="manifest-circle.json"></esp-web-install-button>
  </div>

  <div class="device">
    <h2>NanoCircle</h2>
    <p>Wemos D1 Mini &mdash; ESP8266</p>
    <esp-web-install-button manifest="manifest-nanocircle.json"></esp-web-install-button>
  </div>

  <p class="note">Requires Chrome or Edge. Firefox and Safari do not support WebSerial.</p>
</body>
</html>
